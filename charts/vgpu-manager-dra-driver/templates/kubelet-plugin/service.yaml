{{- $monitor := .Values.kubeletPlugin.deviceMonitor | default dict }}
{{- if and .Values.kubeletPlugin.enabled (or .Values.kubeletPlugin.metrics.enabled $monitor.enabled) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vgpu-manager-dra-driver.kubelet-plugin" . }}-metrics
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/component: {{ include "vgpu-manager-dra-driver.kubelet-plugin" . }}
    {{- include "vgpu-manager-dra-driver.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    {{- if .Values.kubeletPlugin.metrics.enabled }}
    - name: metrics
      port: {{ include "vgpu-manager-dra-driver.metricsPort" . | int }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
    {{- if $monitor.enabled }}
    - name: device-metrics
      port: {{ dig "commands" "serverBindPort" 3456 $monitor }}
      targetPort: device-metrics
      protocol: TCP
    {{- end }}
  selector:
    app.kubernetes.io/component: {{ include "vgpu-manager-dra-driver.kubelet-plugin" . }}
    {{- include "vgpu-manager-dra-driver.selectorLabels" . | nindent 4 }}
{{- end }}
