{{- if .Values.deviceClasses.enabled -}}
{{- $apiVersion := (include "vgpu-manager-dra-driver.resourceApiVersion" . | trim) }}
{{- $driver := .Values.deviceClasses.driverName | default "manager.nvidia.com" }}
{{- $labels := include "vgpu-manager-dra-driver.labels" . }}
{{- /*
  Remote GPU (design v2.0): the plugin always publishes accessMode=local|remote on every
  device. When remoteGPU.enabled, the local classes are pinned to accessMode == 'local'
  (devices of nodes that did not opt into remote access) and a dedicated class selects
  accessMode == 'remote'. Devices published by a plugin older than this attribute carry no
  accessMode and are excluded by the pinned classes until that plugin is upgraded.
*/}}
{{- $localOnly := "" }}
{{- if .Values.deviceClasses.remoteGPU.enabled }}
{{- $localOnly = printf " && device.attributes['%s'].accessMode == 'local'" $driver }}
{{- end }}
{{- if .Values.deviceClasses.gpu.enabled }}
apiVersion: {{ $apiVersion }}
kind: DeviceClass
metadata:
  name: {{ .Values.deviceClasses.gpu.name | default "gpu-manager" }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  selectors:
    - cel:
        expression: "device.driver == '{{ $driver }}' && device.attributes['{{ $driver }}'].type == 'gpu'{{ $localOnly }}"
  {{- if and (eq $apiVersion "resource.k8s.io/v1") .Values.deviceClasses.gpu.extendedResourceName }}
  extendedResourceName: {{ .Values.deviceClasses.gpu.extendedResourceName }}
  {{- end }}
{{- end }}
{{- if .Values.deviceClasses.vgpu.enabled }}
---
apiVersion: {{ $apiVersion }}
kind: DeviceClass
metadata:
  name: {{ .Values.deviceClasses.vgpu.name | default "vgpu-manager" }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  selectors:
    - cel:
        expression: "device.driver == '{{ $driver }}' && device.attributes['{{ $driver }}'].type == 'vgpu'{{ $localOnly }}"
{{- end }}
{{- if .Values.deviceClasses.mig.enabled }}
---
apiVersion: {{ $apiVersion }}
kind: DeviceClass
metadata:
  name: {{ .Values.deviceClasses.mig.name | default "mig-manager" }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  selectors:
    - cel:
        expression: "device.driver == '{{ $driver }}' && device.attributes['{{ $driver }}'].type == 'mig'"
{{- end }}
{{- if .Values.deviceClasses.vfio.enabled }}
---
apiVersion: {{ $apiVersion }}
kind: DeviceClass
metadata:
  name: {{ .Values.deviceClasses.vfio.name | default "vfio-manager" }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  selectors:
    - cel:
        expression: "device.driver == '{{ $driver }}' && device.attributes['{{ $driver }}'].type == 'vfio'"
{{- end }}
{{- if .Values.deviceClasses.remoteGPU.enabled }}
---
apiVersion: {{ $apiVersion }}
kind: DeviceClass
metadata:
  name: {{ .Values.deviceClasses.remoteGPU.name | default "remote-vgpu-manager" }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  selectors:
    - cel:
        expression: "device.driver == '{{ $driver }}' && device.attributes['{{ $driver }}'].type == '{{ .Values.deviceClasses.remoteGPU.deviceType | default "vgpu" }}' && device.attributes['{{ $driver }}'].accessMode == 'remote'"
{{- end }}
{{- end }}
