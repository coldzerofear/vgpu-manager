name: Build and Push to Tencent CCR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 正确安装腾讯云 CLI
      - name: Install tccli correctly
        run: |
          sudo apt update
          sudo apt install -y python3-pip
          sudo pip3 install tccli

      # 获取 CCR 临时登录凭证
      - name: Get CCR Login Token
        run: |
          tccli configure set secretId ${{ secrets.TENCENT_SECRET_ID }}
          tccli configure set secretKey ${{ secrets.TENCENT_SECRET_KEY }}
          tccli configure set region ap-beijing
          
          TOKEN=$(tccli ccr GetAuthorizationToken --output json | grep -o '"AuthorizationToken":"[^"]*"' | cut -d '"' -f 4)
          echo "CCR_PASSWORD=$TOKEN" >> $GITHUB_ENV

      # 登录腾讯云 CCR
      - name: Login to Tencent CCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: 100000000000
          password: ${{ env.CCR_PASSWORD }}

      # 构建并推送（把 你的命名空间 改成你真实的）
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ccr.ccs.tencentyun.com/kingderliu/vgpu-manage
