name: Build and Push to Tencent TCR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 关键修改：这里换成你配置的密钥名
      - name: Login to Tencent Cloud TCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com  # 注意：替换成你的TCR实际域名（比如xxx.tencentcloudcr.com）
          username: ${{ secrets.TENCENT_SECRET_ID }}   # 对应你配置的SecretId
          password: ${{ secrets.TENCENT_SECRET_KEY }}  # 对应你配置的SecretKey

      # 构建并推送镜像（注意替换成你的TCR命名空间）
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 格式：你的TCR域名/命名空间/仓库名:标签
          tags: ccr.ccs.tencentyun.com/你的命名空间/kkk-vgpu-manage:${{ github.sha }}
          
