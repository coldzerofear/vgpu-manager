name: Build and Push to Tencent CCR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get CCR Temp Password (Direct API)
        run: |
          apt install -y curl jq
          SecretId="${{ secrets.TENCENT_SECRET_ID }}"
          SecretKey="${{ secrets.TENCENT_SECRET_KEY }}"
          
          # 直接调用腾讯云 API 获取临时密码
          res=$(curl -s -X POST https://ccr.api.tencentcloudapi.com/ \
            -H "Content-Type: application/json" \
            -H "X-TC-Action: GetAuthorizationToken" \
            -H "X-TC-Version: 2018-12-01" \
            -H "X-TC-Region: ap-beijing" \
            -H "X-TC-SecretId: $SecretId" \
            -H "X-TC-Timestamp: $(date +%s)" \
            -d '{}')
          
          # 提取密码
          pass=$(echo "$res" | jq -r .Response.AuthorizationToken)
          echo "CCR_PASS=$pass" >> $GITHUB_ENV

      - name: Login to Tencent CCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: "100000000000"
          password: ${{ env.CCR_PASS }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ccr.ccs.tencentyun.com/kingderliu/vgpu-manage
