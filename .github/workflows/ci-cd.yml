name: Build and Push to Tencent CCR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tencent Cloud CLI
        run: |
          curl -o tccli https://github.com/TencentCloud/tccli/releases/download/v3.0.0/tccli-linux-amd64
          chmod +x tccli
          sudo mv tccli /usr/local/bin/

      - name: Get CCR Login Token
        run: |
          tccli configure set secretId ${{ secrets.TENCENT_SECRET_ID }}
          tccli configure set secretKey ${{ secrets.TENCENT_SECRET_KEY }}
          tccli configure set region ap-beijing
          
          # 获取 CCR 登录密码
          PASSWORD=$(tccli ccr GetAuthorizationToken --query 'AuthorizationToken' --output text)
          echo "::add-mask::$PASSWORD"
          echo "CCR_PASSWORD=$PASSWORD" >> $GITHUB_ENV

      - name: Login to Tencent CCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: 100010001000      # 固定（不需要改）
          password: ${{ env.CCR_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ccr.ccs.tencentyun.com/kingderliu/vgpu-manage
