name: Build to Tencent CCR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tencent CLI
        run: sudo apt update && sudo apt install -y python3-pip && sudo pip3 install tccli

      - name: Get CCR Token
        run: |
          tccli configure set secretId ${{ secrets.TENCENT_SECRET_ID }}
          tccli configure set secretKey ${{ secrets.TENCENT_SECRET_KEY }}
          tccli configure set region ap-beijing
          
          # 获取临时密码
          TOKEN=$(tccli ccr GetAuthorizationToken | grep -oP '"AuthorizationToken":"\K[^"]+')
          echo "CCR_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Login to Tencent CCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: 100010001000   # 固定，不用改！
          password: ${{ env.CCR_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ccr.ccs.tencentyun.com/kingderliu/vgpu-manage
