# Publishes the two product images to ghcr.io as dual-architecture
# (amd64 + arm64) manifests.
#
# Why two native jobs instead of one buildx run with QEMU: Dockerfile.base
# compiles this project with CGO_ENABLED=1 inside the CUDA devel image, so an
# arm64 build under emulation runs the whole toolchain through QEMU and takes
# the better part of an hour. GitHub's arm64 runners are free for public
# repositories, so each architecture builds natively at full speed with the
# same `make docker-build-all` a developer runs locally, and a third job stitches
# the two into one manifest.
#
# The base image stays on its runner: it is only an input to the two product
# images and is never pushed. The per-architecture tags (…-amd64, …-arm64) are
# pushed, because a manifest can only be assembled from images a registry
# already holds; they are kept rather than deleted so a bad merge can be
# unpicked.
name: Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (default: the computed one)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Not cancel-in-progress: a half-published manifest is worse than a slow one.
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  meta:
    name: Resolve tags
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.tags.outputs.version }}
      extra: ${{ steps.tags.outputs.extra }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Compute the tags
        id: tags
        # version: the primary tag, and what the per-architecture tags are
        #          derived from.
        # extra:   additional tags the final manifest also gets.
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.tag }}" ]]; then
            version="${{ inputs.tag }}"
            extra=""
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            extra="latest"
          else
            version="main"
            extra="sha-$(git rev-parse --short HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "extra=${extra}" >> "$GITHUB_OUTPUT"
          echo "primary tag: ${version}, extra: ${extra:-none}"

  build:
    name: Build ${{ matrix.arch }}
    needs: [meta]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free disk space
        # The CUDA devel base image alone is several gigabytes and the runner
        # starts with ~14 GB free; base plus both product images does not fit
        # without this.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY}"
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The version string embedded in the binaries comes from git.
          fetch-depth: 0
          persist-credentials: false
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The built-in token is enough with packages: write above; no secret
          # has to be configured for this repository.
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.arch }}
        # Plain docker build on a native runner: no buildx, no QEMU, no
        # cross-compilation. The base image is built here, consumed by the two
        # product builds from the local daemon, and discarded with the runner.
        run: |
          make docker-build-all docker-push-all \
            REGISTRY=${{ env.REGISTRY }} \
            TAG=${{ needs.meta.outputs.version }}-${{ matrix.arch }} \
            GOPROXY=https://proxy.golang.org,direct \
            APT_MIRROR=
      - name: Published images
        run: |
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep vgpu-manager

  manifest:
    name: Merge manifests
    needs: [meta, build]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4
      - name: Create the dual-architecture manifests
        # imagetools reads the two per-architecture images straight from the
        # registry and writes one manifest list, so nothing is pulled or
        # rebuilt here.
        run: |
          set -euo pipefail
          version="${{ needs.meta.outputs.version }}"
          extra="${{ needs.meta.outputs.extra }}"
          for repo in vgpu-manager vgpu-manager-dra-driver; do
            image="${{ env.REGISTRY }}/${repo}"
            tags=("-t" "${image}:${version}")
            if [[ -n "${extra}" ]]; then
              tags+=("-t" "${image}:${extra}")
            fi
            echo "::group::${image}:${version}"
            docker buildx imagetools create "${tags[@]}" \
              "${image}:${version}-amd64" \
              "${image}:${version}-arm64"
            docker buildx imagetools inspect "${image}:${version}"
            echo "::endgroup::"
          done
      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            for repo in vgpu-manager vgpu-manager-dra-driver; do
              echo "- \`${{ env.REGISTRY }}/${repo}:${{ needs.meta.outputs.version }}\` (amd64, arm64)"
            done
          } >> "$GITHUB_STEP_SUMMARY"
