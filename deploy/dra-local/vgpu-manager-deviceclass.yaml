apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: gpu-manager
spec:
  selectors:
    - cel:
        expression: "device.driver == 'manager.nvidia.com' && device.attributes['manager.nvidia.com'].type == 'gpu'"
  extendedResourceName: nvidia.com/gpu
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: vgpu-manager
spec:
  selectors:
    - cel:
        expression: "device.driver == 'manager.nvidia.com' && device.attributes['manager.nvidia.com'].type == 'vgpu'"
---
